<div><label class="form-label">Category</label><input class="form-control" name="category" list="personalCategorySuggestions" maxlength="60" placeholder="e.g. Food & dining" autocomplete="off" required></div>
<div><label class="form-label">Amount (&#2547;)</label><div class="money-input"><span>&#2547;</span><input class="form-control" type="number" name="amount" min="0.01" max="1000000000" step="0.01" inputmode="decimal" placeholder="0.00" required></div></div>
<div class="row g-3"><div class="col-sm-6"><label class="form-label">Date</label><input class="form-control" type="date" name="expense_date" value="{{ today }}" required></div><div class="col-sm-6"><label class="form-label">Payment method</label><select class="form-select" name="payment_method" required>{% for method in payment_methods %}<option value="{{ method }}">{{ method }}</option>{% endfor %}</select></div></div>
<div><label class="form-label">Link to a tour <span class="optional-label">Optional</span></label><select class="form-select" name="tour_id"><option value="">No linked tour</option>{% for tour in tours %}<option value="{{ tour['id'] }}">{{ tour['title'] }}</option>{% endfor %}</select><div class="field-hint">For reference only; it will not affect the tour total.</div></div>
<div><label class="form-label">Notes <span class="optional-label">Optional</span></label><textarea class="form-control" name="notes" rows="3" maxlength="500" placeholder="What was this expense for?"></textarea></div>
