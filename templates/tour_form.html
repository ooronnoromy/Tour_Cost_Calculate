{% extends "base.html" %}
{% block title %}{{ mode }} Tour · TourCost Pro{% endblock %}
{% block content %}
<div class="form-hero mb-4 mb-lg-5">
    <div>
        <span class="eyebrow">Tour setup</span>
        <h1>{{ mode }} Tour Budget</h1>
        <p>Create the tour first. You will add travel, food, hotel, and other expenses later from the tour page.</p>
    </div>
</div>

<div class="row g-4 align-items-start">
    <div class="col-lg-8">
        <div class="card border-0 tour-surface">
            <div class="card-body p-4 p-xl-5">
                <form method="post" id="tourForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tour title *</label>
                            <input class="form-control" name="title" required value="{{ tour['title'] if tour else '' }}" placeholder="Cox's Bazar Weekend">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Destination *</label>
                            <input class="form-control" name="destination" required value="{{ tour['destination'] if tour else '' }}" placeholder="Cox's Bazar, Bangladesh">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Start date *</label>
                            <input type="date" class="form-control" name="start_date" required value="{{ tour['start_date'] if tour else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">End date *</label>
                            <input type="date" class="form-control" name="end_date" required value="{{ tour['end_date'] if tour else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Travelers *</label>
                            <input type="number" min="1" class="form-control" name="travelers" required value="{{ tour['travelers'] if tour else 1 }}">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control" rows="3" name="notes" placeholder="Hotel name, transport plan, reminders...">{{ tour['notes'] if tour else '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary px-4" type="submit">{{ mode }} Budget</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
