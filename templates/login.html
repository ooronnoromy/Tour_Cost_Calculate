{% extends "base.html" %}
{% block title %}Login · TourCost Pro{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card card border-0">
        <div class="card-body auth-card-body">
            <div class="login-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M7 7.5V6a5 5 0 0 1 10 0v1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <rect x="4" y="7.5" width="16" height="13" rx="4" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="auth-heading">
                <span class="auth-kicker">TourCost Pro</span>
                <h1>Welcome back</h1>
                <p>Sign in to continue managing your tours and budgets.</p>
            </div>
            <form method="post" class="auth-form">
                <div class="auth-field">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control form-control-lg" id="username" name="username" autocomplete="username" placeholder="Enter your username" autofocus required>
                </div>
                <div class="auth-field">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-field">
                        <input type="password" class="form-control form-control-lg" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                        <button class="password-toggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" data-password-toggle>
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="m4 4 16 16M10.6 6.15A10.9 10.9 0 0 1 12 6c6 0 9.5 6 9.5 6a16.6 16.6 0 0 1-2.05 2.72M6.1 6.8C3.75 8.58 2.5 12 2.5 12s3.5 6 9.5 6c1.1 0 2.1-.2 3-.52M9.88 9.88a3 3 0 0 0 4.24 4.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="btn auth-submit" type="submit">
                    <span>Sign in</span>
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
            <p class="auth-security-note">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 3 5 6v5c0 4.5 2.8 8.1 7 10 4.2-1.9 7-5.5 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                    <path d="m9.5 12 1.7 1.7 3.5-3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Your account is protected by secure authentication.
            </p>
        </div>
    </div>
</div>
{% endblock %}
